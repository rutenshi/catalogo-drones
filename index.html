<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Interactivo de Equipos - FAMAQ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <h1>FAMAQ <span>DJI Agriculture</span></h1>
    </div>
    <button class="btn-carrito" onclick="abrirModalCarrito()">
      🛒 Pedido <span id="badge-contador" class="badge">0</span>
    </button>
  </header>

  <main class="contenedor-principal">
    
    <section class="catalogo-grid">
      
      <div class="tarjeta-producto" onclick="seleccionarProductoPorCodigo('T100')">
        <img src="img/t100.jpg" alt="DJI Agras T100" onerror="this.src='https://via.placeholder.com/300x200?text=DJI+T100'">
        <h3>DJI Agras T100</h3>
        <p class="precio-tarjeta" id="precio-tarjeta-T100">Cargando precio...</p>
        <button class="btn-ver">Ver Detalles</button>
      </div>

      <div class="tarjeta-producto" onclick="seleccionarProductoPorCodigo('T70P')">
        <img src="img/t70p.jpg" alt="DJI Agras T70P" onerror="this.src='https://via.placeholder.com/300x200?text=DJI+T70P'">
        <h3>DJI Agras T70P</h3>
        <p class="precio-tarjeta" id="precio-tarjeta-T70P">Cargando precio...</p>
        <button class="btn-ver">Ver Detalles</button>
      </div>

      <div class="tarjeta-producto" onclick="seleccionarProductoPorCodigo('T55')">
        <img src="img/t55.jpg" alt="DJI Agras T55" onerror="this.src='https://via.placeholder.com/300x200?text=DJI+T55'">
        <h3>DJI Agras T55</h3>
        <p class="precio-tarjeta" id="precio-tarjeta-T55">Cargando precio...</p>
        <button class="btn-ver">Ver Detalles</button>
      </div>

      <div class="tarjeta-producto" onclick="seleccionarProductoPorCodigo('T25P')">
        <img src="img/t25p.jpg" alt="DJI Agras T25P" onerror="this.src='https://via.placeholder.com/300x200?text=DJI+T25P'">
        <h3>DJI Agras T25P</h3>
        <p class="precio-tarjeta" id="precio-tarjeta-T25P">Cargando precio...</p>
        <button class="btn-ver">Ver Detalles</button>
      </div>

    </section>

    <aside class="panel-detalle" id="panel-detalle">
      <div class="detalle-header">
        <h2 id="detalle-titulo">Selecciona un modelo</h2>
      </div>
      
      <div class="detalle-body">
        <img id="detalle-imagen" src="https://via.placeholder.com/300x200?text=Selecciona+un+Dron" alt="Vista previa del dron">
        
        <div class="controles-pedido" id="controles-dron" style="display:none;">
          <label class="etiqueta-principal">CANTIDAD DE EQUIPOS</label>
          <div class="selector-cantidad">
            <button type="button" onclick="ajustarDrones(-1)">-</button>
            <input type="number" id="cantidad-d
